name: Build Android APK

on:
  push:
    branches: [ "main", "fix/build-ready-media-assistant", "foundation/android16-virtual-space-audit" ]
  pull_request:
    branches: [ "main", "fix/build-ready-media-assistant" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Avoid setup-android's default attempt to install the removed SDK package "tools".
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate Gradle configuration
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-camera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
